name: Daybook
options:
  bundleIdPrefix: ca.atlys.daybook
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Simulator builds are signed ad hoc ("Sign to Run Locally") so Keychain works without a team.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
packages:
  DaybookKit:
    path: DaybookKit
targets:
  Daybook:
    type: application
    platform: iOS
    sources:
      - path: Daybook
    dependencies:
      - package: DaybookKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.atlys.daybook
        PRODUCT_NAME: daybook
        # Paid Atlys Networks Inc. team for device installs and App Store distribution.
        DEVELOPMENT_TEAM: 9ABFFFH4DJ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Hand-maintained and preprocessed: App Transport Security differs per configuration.
        # Release: HTTPS only. Debug: also plain HTTP on the local network (dev server, UI tests).
        INFOPLIST_FILE: Daybook/Info.plist
        INFOPLIST_PREPROCESS: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: DAYBOOK_DEBUG=1
  DaybookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaybookUITests
    dependencies:
      - target: Daybook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.atlys.daybook.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Daybook
schemes:
  Daybook:
    build:
      targets:
        Daybook: all
        DaybookUITests: [test]
    # Run from Xcode installs the Release build (built-in server, HTTPS only) — what goes on the
    # phone. UI tests use the Debug config (local test server). Switch Run to Debug in the scheme
    # editor only for debugging; the next `xcodegen generate` resets it.
    run:
      config: Release
    test:
      config: Debug
      targets:
        - DaybookUITests

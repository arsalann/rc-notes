name: main.goals_weekly
type: empty
description: |-
  Weekly goals are one free-form markdown entry per week (Sunday-start), shared
  across every day of that week in the daybook. Editing the goals on any day of a
  week updates the single row for that week, so the change is reflected on every
  other day of the same week.

  The table is created and mutated by the app (`app/server/utils/db.ts` DDL +
  `app/server/api/goals/*`), not by Bruin — this asset documents the schema.
  Entries are created lazily on first read/write of a week. Soft-delete via
  `deleted_at` preserves history.

columns:
  - name: id
    type: VARCHAR
    description: UUID primary key.
  - name: workspace_id
    type: VARCHAR
    description: FK → workspaces.id. Defaults to the "Work" workspace when unset.
  - name: week_start
    type: DATE
    description: Sunday of the week this entry represents (one entry per workspace per week by convention; not enforced as a uniqueness constraint).
  - name: content
    type: VARCHAR
    description: Markdown body of the week's goals. Empty string when the row is auto-created and the user hasn't written anything yet.
  - name: created_at
    type: TIMESTAMP
    description: Insert timestamp.
  - name: updated_at
    type: TIMESTAMP
    description: Last-write timestamp.
  - name: user_id
    type: VARCHAR
    description: Owner user id. Multi-user not wired up yet.
  - name: user_name
    type: VARCHAR
    description: Denormalized owner username.
  - name: deleted_at
    type: TIMESTAMP
    description: Soft-delete timestamp.
  - name: updated_by
    type: VARCHAR
    description: |-
      Provenance for the last write. Standard values: `user_in_app`,
      `user_in_test`, `test_playwright`, `agent_query`,
      `agent_query_<purpose>_<date>`, `recovery_script`, `unknown`.
  - name: created_device_kind
    type: VARCHAR
    description: Client kind that created the row (`ios`, `browser`, `curl`, …), from the User-Agent. NULL for rows created before offline sync or by raw SQL.
  - name: created_device_id
    type: VARCHAR
    description: Device id of the creating client (`X-Daybook-Device` header — iOS identifierForVendor, or a random per-browser id). NULL when unknown.
  - name: updated_device_kind
    type: VARCHAR
    description: Client kind of the last write. Set by the `daybook_sync_row` trigger; NULL for raw-SQL writes.
  - name: updated_device_id
    type: VARCHAR
    description: Device id of the last write. Set by the `daybook_sync_row` trigger; NULL for raw-SQL writes.
  - name: client_updated_at
    type: TIMESTAMP
    description: When the last edit was made on the device (UTC, device clock capped at the server's receive time). Equals the write time for online writes; earlier for changes queued offline on the iOS app.
  - name: sync_op_id
    type: VARCHAR
    description: Id of the queued iOS change (`sync_ops.op_id`, `event_log.sync_op_id`) that last wrote the row; NULL for direct API writes.
  - name: field_clock
    type: JSON
    description: Per-field edit times as JSON, one key per field holding the UTC time of the edit that wrote it, used for last-writer-wins per field. `status`, `completed` and `completed_at` share the `status` key. Maintained by the trigger; not returned by the sync pull.
  - name: sync_seq
    type: BIGINT
    description: Global, increasing number (sequence `sync_seq`) stamped on every insert and update; clients pull rows with `sync_seq` above their cursor (`GET /api/sync/pull`).

name: main.links
type: empty
description: |-
  Generic bidirectional link table connecting any two pieces of content.
  Each row models one directed edge — the UI reads links in both directions
  to render backlinks. Currently used for:

    - `note` ↔ `note` — `@mention` linking between notes
    - `note` ↔ `task` — task references in note bodies and vice versa
    - `diary` → `task` — auto-created when a task gets a `due_at`, so the
      task appears under that day's diary entry (see `linkTaskToDiary()` in
      `app/server/utils/db.ts`).

  Stale `diary → task` rows are cleaned up when a task's due_at changes day
  or is cleared. There is no FK enforcement — `source_id`/`target_id` are
  free-form VARCHARs and orphaned links are tolerated.

columns:
  - name: id
    type: VARCHAR
    description: UUID primary key.
  - name: source_type
    type: VARCHAR
    description: Type of the source entity — one of `task`, `note`, `diary`.
  - name: source_id
    type: VARCHAR
    description: UUID of the source entity (id from the corresponding table). Not FK-enforced.
  - name: target_type
    type: VARCHAR
    description: Type of the target entity — one of `task`, `note`, `diary`.
  - name: target_id
    type: VARCHAR
    description: UUID of the target entity. Not FK-enforced.
  - name: created_at
    type: TIMESTAMP
    description: Insert timestamp.
  - name: user_id
    type: VARCHAR
    checks:
      - name: not_null
    description: Required owner user id (FK to users.id; deletion restricted until content cleanup). Row level security (policy `daybook_owner`) limits every request to the signed-in user's rows; new rows default to the request's user (`daybook.user_id`).
  - name: updated_by
    type: VARCHAR
    description: Provenance for the last write (see `tasks.updated_by` for the standard vocabulary).
  - name: created_device_kind
    type: VARCHAR
    description: Client kind that created the row (`ios`, `browser`, `curl`, …), from the User-Agent. NULL for rows created before offline sync or by raw SQL.
  - name: created_device_id
    type: VARCHAR
    description: Device id of the creating client (`X-Daybook-Device` header — iOS identifierForVendor, or a random per-browser id). NULL when unknown.
  - name: updated_device_kind
    type: VARCHAR
    description: Client kind of the last write. Set by the `daybook_sync_row` trigger; NULL for raw-SQL writes.
  - name: updated_device_id
    type: VARCHAR
    description: Device id of the last write. Set by the `daybook_sync_row` trigger; NULL for raw-SQL writes.
  - name: client_updated_at
    type: TIMESTAMP
    description: When the last edit was made on the device (UTC, device clock capped at the server's receive time). Equals the write time for online writes; earlier for changes queued offline on the iOS app.
  - name: sync_op_id
    type: VARCHAR
    description: Id of the queued iOS change (`sync_ops.op_id`, `event_log.sync_op_id`) that last wrote the row; NULL for direct API writes.
  - name: field_clock
    type: JSON
    description: Per-field edit times as JSON, one key per field holding the UTC time of the edit that wrote it, used for last-writer-wins per field. `status`, `completed` and `completed_at` share the `status` key. Maintained by the trigger; not returned by the sync pull.
  - name: sync_seq
    type: BIGINT
    description: Global, increasing number (sequence `sync_seq`) stamped on every insert and update; clients pull rows with `sync_seq` above their cursor (`GET /api/sync/pull`).
